spring.application.name=carelink
server.port=8081

# Database Configuration
spring.datasource.url=${CARELINK_DB_URL:jdbc:mysql://localhost:3306/carelink}
spring.datasource.username=${CARELINK_DB_USER:root}
spring.datasource.password=${CARELINK_DB_PASSWORD:}

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Security / JWT (Placeholders for now)
carelink.jwt.secret=${CARELINK_JWT_SECRET}
carelink.jwt.expiration=86400000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CARELINK_MAIL_USERNAME:}
spring.mail.password=${CARELINK_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.debug=true
